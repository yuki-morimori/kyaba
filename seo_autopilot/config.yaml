# ============================================================
#  SEO自動運転パイプラインの設定
#  ここを自分のジャンル・読者・トーンに書き換えるだけで、
#  動画の「補助金メディア」と同じ仕組みを別ジャンルで回せます。
# ============================================================

# メディアのテーマ／ニッチ（例: 補助金, 相続, BtoB SaaS比較, ナイトワーク求人 など）
# ↓ AI・業務自動化ツールの「実践ハウツー」メディアに設定
niche: "AI・業務自動化ツールの実践活用"

# 想定読者
audience: "中小企業・個人事業主・副業で、AIを使って業務を効率化したい人"

# 記事のトーン
# 実際に試した前提で、手順・検証結果を具体的に。まとめ・誇張は避ける。
tone: "実際に使って検証した一次情報ベース。手順は具体的に、誇張せず、できない点も正直に書く"

# 1記事の目標文字数（おおよそ）
target_chars: 3500

# 品質スコアの合格ライン（0.0〜1.0）。これ未満なら自動リライト。
quality_threshold: 0.8

# リライトの最大回数（合格しなければ打ち切り）
max_rewrites: 2

# 使用モデル（Anthropicの最新・最高性能はOpus 4.8）
model: "claude-opus-4-8"

# Web検索で最新情報を補強するか（環境がネットに出られる場合のみtrue）
use_web_search: false

# 生成記事の出力先
output_dir: "output"
